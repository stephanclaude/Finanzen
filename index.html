<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzen</title>
<meta name="description" content="Privates Finanz-Dashboard der Familie: Vermögen und laufende Kosten in drei Ebenen.">
<meta name="theme-color" content="#2F45A3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Drei Ebenen: Dashboard (Vermögen + Laufende Kosten) → Bereich (alle Bausteine) → Baustein (Positionen). Gleiche Optik wie das Sammelkarten-Depot. */
:root {
  --bg: #EDEFF2; --surface: #FFFFFF; --sunk: #E3E7EC; --ink: #16202A; --muted: #5B6875; --line: #D3D9E0;
  --accent: #2F45A3; --accent-ink: #FFFFFF; --accent-soft: #DFE4F7;
  --gain: #1C7349; --loss: #B0363A; --warn: #9A600C;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151B; --surface: #19212A; --sunk: #141A21; --ink: #E4E9EE; --muted: #93A0AD; --line: #2A333D;
    --accent: #93A5F0; --accent-ink: #10151B; --accent-soft: #232D4D;
    --gain: #5CC490; --loss: #EF7E7E; --warn: #E2A94E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151B; --surface: #19212A; --sunk: #141A21; --ink: #E4E9EE; --muted: #93A0AD; --line: #2A333D;
  --accent: #93A5F0; --accent-ink: #10151B; --accent-soft: #232D4D;
  --gain: #5CC490; --loss: #EF7E7E; --warn: #E2A94E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
[hidden] { display: none !important; }
.wrap { max-width: 860px; margin: 0 auto; padding: 12px 16px 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.gain { color: var(--gain); } .loss { color: var(--loss); } .warn { color: var(--warn); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand h1 { font-size: 1.35rem; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: inline-grid; place-items: center; color: var(--muted); }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 20px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { opacity: .6; }
.crumbs .cur { color: var(--ink); font-weight: 500; }

/* Filterzeile */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.filters .gap { flex: 1; }
@media (max-width: 480px) { .filters .chip { padding: 4px 10px; } }

/* Karten */
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; }
a.card { color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card-head h2 { font-size: 1.15rem; }
.go { color: var(--muted); font-size: 13px; white-space: nowrap; }
.lab { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.big { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: .45em; color: var(--muted); font-family: var(--font-body); font-weight: 500; margin-left: 4px; }
.figs { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.figs b { font-family: var(--font-num); font-weight: 500; color: var(--ink); }

/* Diagramm */
.chart { position: relative; width: 100%; height: 170px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .ax { font-family: var(--font-num); font-size: 10px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); fill-opacity: .10; }
.chart .hair { stroke: var(--muted); stroke-width: 1; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .note { position: absolute; inset: auto 0 6px 0; text-align: center; font-size: 12px; color: var(--muted); }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); white-space: nowrap; }
.tip b { display: block; font-family: var(--font-num); font-size: 13px; font-weight: 500; }
.tip span { color: var(--muted); }

/* Listen */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-top: 14px; }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; }
.list-head h2 { font-size: 1.05rem; }
.row { width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; padding: 11px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; color: inherit; text-decoration: none; }
.row:hover { background: var(--sunk); }
.row .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .val { font-family: var(--font-num); text-align: right; }
.row .meta { font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.row .sub { font-family: var(--font-num); font-size: 12px; text-align: right; color: var(--muted); }
.share { grid-column: 1 / -1; height: 4px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 4px; }
.share > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); }
.empty.solo { border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }

/* Hinweise */
.notes { display: grid; gap: 6px; margin-top: 14px; }
.notes a { display: flex; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--ink); text-decoration: none; }
.notes a .lab { color: var(--warn); }

/* Knöpfe & Formulare */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--loss); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgb(10 15 20 / .45); }
.sheet { display: grid; gap: 14px; padding: 18px; }
.sheet h2 { font-size: 1.2rem; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.field input[inputmode=decimal], .hist-add input[inputmode=decimal] { font-family: var(--font-num); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hist { display: grid; gap: 4px; }
[data-hlist] { max-height: 216px; overflow-y: auto; }
.hist-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.hist-add input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.hist-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.hist-row .num { margin-left: auto; }
.x { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--loss); background: var(--sunk); }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sheet-foot .left { margin-right: auto; }
.typ { display: grid; gap: 8px; }
.typ label { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.typ label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.typ input { grid-row: span 2; margin-top: 4px; }
.typ small { color: var(--muted); }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; margin-top: 14px; }
.section h2 { font-size: 1.05rem; }
.section p { margin: 0; font-size: 14px; color: var(--muted); }
.pers { display: flex; gap: 6px; flex-wrap: wrap; }
.pers span { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 12px; font-size: 13px; }
.inline { display: flex; gap: 6px; }
.inline input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } .card { padding: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/"><h1>Finanzen</h1></a>
    <a class="iconbtn" href="#/einstellungen" aria-label="Einstellungen" title="Einstellungen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Ebene"></nav>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ───────────── Speicher: alles in IndexedDB auf diesem Gerät ───────────── */
const DBNAME = 'finanzen';
const leer = () => ({ version: 1, personen: [], bausteine: {} });
let S = leer();
let idb = null;
function openIdb() {
  return new Promise(res => {
    try {
      const r = indexedDB.open(DBNAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch { res(null); }
  });
}
async function laden() {
  idb = await openIdb();
  let d = null;
  if (idb) d = await new Promise(res => { try { const t = idb.transaction('kv').objectStore('kv').get('state'); t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null); } catch { res(null); } });
  else { try { d = JSON.parse(localStorage.getItem(DBNAME)); } catch {} }
  if (d && typeof d === 'object') S = Object.assign(leer(), d);
}
function speichern() {
  return new Promise((res, rej) => {
    if (!idb) { try { localStorage.setItem(DBNAME, JSON.stringify(S)); return res(); } catch (e) { return rej(e); } }
    const tx = idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(S, 'state');
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function aendern(fn) {
  const vorher = JSON.stringify(S);
  fn();
  try { await speichern(); } catch { S = JSON.parse(vorher); toast('Speichern fehlgeschlagen'); }
  render();
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// Merkt sich nur Bequemlichkeiten (gewählte Person, Zeitraum) – darf fehlen
const pref = {
  get(k, d) { try { return localStorage.getItem('fin.' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fin.' + k, v); } catch {} },
};

/* ───────────── Hilfen ───────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = new Intl.NumberFormat('de-AT', { style: 'currency', currency: 'EUR' });
const eur0 = new Intl.NumberFormat('de-AT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const kompakt = new Intl.NumberFormat('de-AT', { notation: 'compact', maximumFractionDigits: 1 });
const fEur = v => eur.format(v || 0);
const fEur0 = v => eur0.format(v || 0);
const heute = () => new Date().toISOString().slice(0, 10);
const fDatum = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const fMonat = d => new Date(d + 'T12:00:00').toLocaleDateString('de-AT', { month: 'short', year: '2-digit' });
const tageBis = d => Math.round((new Date(d + 'T12:00:00') - new Date(heute() + 'T12:00:00')) / 864e5);
// akzeptiert 1234,5 · 1.234,50 · 1234.5
const zahl = v => { if (v === '' || v == null) return null; let t = String(v).replace(/[\s€]/g, ''); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = Number(t); return t !== '' && isFinite(n) ? n : null; };
const personName = id => S.personen.find(p => p.id === id)?.name || '';
const diff = (v, alt, fmt = fEur) => {
  if (alt == null) return '';
  const d = v - alt; if (Math.abs(d) < 0.005) return '<span class="muted">±0 zum Vormonat</span>';
  return `<span class="${d > 0 ? 'gain' : 'loss'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</span> <span class="muted">zum Vormonat</span>`;
};

/* ───────────── Ebene 1 und 2: die beiden Bereiche ───────────── */
const BEREICHE = {
  vermoegen: { name: 'Vermögen', einheit: '', wort: 'Wert', leer: 'Noch kein Vermögensbaustein. Lege z. B. „ETF-Depot“, „Konten“ oder „Altersvorsorge“ an.' },
  kosten: { name: 'Laufende Kosten', einheit: 'pro Monat', wort: 'Monatlich', leer: 'Noch kein Kostenbaustein. Lege z. B. „Versicherungen“, „Abos“, „Handy“ oder „Auto“ an.' },
};

/* ───────────── Ebene 3: Baustein-Vorlagen ─────────────
   Jede Vorlage gehört zu einem Bereich und liefert für eine Position ihren Wert an einem Stichtag.
   Neue Tracker (z. B. das Sammelkarten-Depot) werden als weitere Vorlage hier eingehängt. */
const INTERVALLE = { monat: ['monatlich', 1], quartal: ['vierteljährlich', 3], halbjahr: ['halbjährlich', 6], jahr: ['jährlich', 12] };
const VORLAGEN = {
  stand: {
    bereich: 'vermoegen', name: 'Stand-Verlauf',
    info: 'Konten, Depots, Vorsorge, Sparbuch … Du trägst ab und zu den aktuellen Stand ein.',
    posWort: 'Position', posMehr: 'Positionen',
    felder: [
      { k: 'name', l: 'Bezeichnung', t: 'text', pflicht: true, ph: 'z. B. Vanguard FTSE All-World' },
      { k: 'anbieter', l: 'Anbieter / Bank', t: 'text' },
      { k: 'person', l: 'Gehört', t: 'person' },
      { k: 'sparrate', l: 'Sparrate pro Monat (optional)', t: 'eur' },
      { k: 'werte', l: 'Stand', t: 'verlauf' },
      { k: 'notiz', l: 'Notiz', t: 'notiz' },
    ],
    wert(p, d) { let best = null, bd = ''; for (const [k, v] of Object.entries(p.werte || {})) if (k <= d && k > bd) { bd = k; best = v; } return best ?? 0; },
    daten: p => Object.keys(p.werte || {}),
    zeile(p) {
      const ks = Object.keys(p.werte || {}).sort(); const letzt = ks.at(-1);
      return { meta: [p.anbieter, personName(p.person), letzt ? 'Stand ' + fDatum(letzt) : 'noch kein Stand'].filter(Boolean).join(' · '),
               sub: p.sparrate ? fEur(p.sparrate) + '/Monat' : '' };
    },
    hinweise(p) { const ks = Object.keys(p.werte || {}).sort(); const letzt = ks.at(-1); if (!letzt) return ['noch kein Stand eingetragen']; const t = -tageBis(letzt); return t > 120 ? [`seit ${Math.round(t / 30)} Monaten nicht aktualisiert`] : []; },
  },
  kosten: {
    bereich: 'kosten', name: 'Kostenliste',
    info: 'Versicherungen, Abos, Handyverträge, Kreditraten, Auto … Betrag und Zahlungsintervall.',
    posWort: 'Vertrag', posMehr: 'Verträge',
    felder: [
      { k: 'name', l: 'Bezeichnung', t: 'text', pflicht: true, ph: 'z. B. Kfz-Haftpflicht' },
      { k: 'anbieter', l: 'Anbieter', t: 'text' },
      { k: 'person', l: 'Gehört', t: 'person' },
      { k: 'betrag', l: 'Betrag', t: 'eur', pflicht: true, halb: true },
      { k: 'intervall', l: 'Zahlung', t: 'auswahl', optionen: Object.fromEntries(Object.entries(INTERVALLE).map(([k, v]) => [k, v[0]])), halb: true },
      { k: 'beginn', l: 'Beginn', t: 'datum', halb: true },
      { k: 'ende', l: 'Ende / gekündigt zum', t: 'datum', halb: true },
      { k: 'frist', l: 'Nächster Kündigungs- oder Verlängerungstermin', t: 'datum' },
      { k: 'notiz', l: 'Notiz', t: 'notiz' },
    ],
    monatlich: p => (p.betrag || 0) / (INTERVALLE[p.intervall || 'monat']?.[1] || 1),
    wert(p, d) { if (p.beginn && p.beginn > d) return 0; if (p.ende && p.ende <= d) return 0; return this.monatlich(p); },
    daten: p => [p.beginn, p.ende].filter(Boolean),
    zeile(p) {
      const iv = INTERVALLE[p.intervall || 'monat'];
      const vorbei = p.ende && p.ende <= heute();
      return { meta: [p.anbieter, personName(p.person), vorbei ? 'beendet ' + fDatum(p.ende) : p.ende ? 'endet ' + fDatum(p.ende) : ''].filter(Boolean).join(' · '),
               sub: iv[1] === 1 ? '' : fEur(p.betrag) + ' ' + iv[0] };
    },

/* ───────────── Berechnung: alles hängt an „Wert einer Position am Stichtag“ ───────────── */
let personFilter = pref.get('person', '');
let zeitraum = pref.get('zeitraum', '12');
const positionen = b => Object.entries(b.positionen || {}).map(([id, p]) => ({ id, ...p })).filter(p => !personFilter || p.person === personFilter);
const bausteineVon = ber => Object.values(S.bausteine).filter(b => VORLAGEN[b.vorlage]?.bereich === ber).sort((a, b) => (a.reihe ?? 0) - (b.reihe ?? 0) || a.name.localeCompare(b.name));
const bausteinWert = (b, d = heute()) => { const v = VORLAGEN[b.vorlage]; return positionen(b).reduce((s, p) => s + (v.wert(p, d) || 0), 0); };
const bereichWert = (ber, d = heute()) => bausteineVon(ber).reduce((s, b) => s + bausteinWert(b, d), 0);
const monatsende = d => { const x = new Date(d + 'T12:00:00'); return new Date(x.getFullYear(), x.getMonth() + 1, 0, 12).toISOString().slice(0, 10); };
const vormonatsende = () => { const x = new Date(); return new Date(x.getFullYear(), x.getMonth(), 0, 12).toISOString().slice(0, 10); };
// Verlauf: ein Punkt pro Monatsende, der letzte ist heute
function verlauf(bausteine, wertFn) {
  let erst = null;
  for (const b of bausteine) for (const p of positionen(b)) for (const d of VORLAGEN[b.vorlage].daten(p)) if (d && d <= heute() && (!erst || d < erst)) erst = d;
  if (!erst) return [];
  const h = heute(); let start = monatsende(erst);
  if (zeitraum !== 'alles') { const x = new Date(); const g = new Date(x.getFullYear(), x.getMonth() - Number(zeitraum) + 1, 0, 12).toISOString().slice(0, 10); if (start < g) start = g; }
  const pts = [];
  for (let d = start; d < h; d = monatsende(new Date(new Date(d + 'T12:00:00').getTime() + 2 * 864e5).toISOString().slice(0, 10))) pts.push({ d, v: wertFn(d) });
  pts.push({ d: h, v: wertFn(h) });
  return pts;
}
function hinweise() {
  const out = [];
  for (const b of Object.values(S.bausteine)) { const v = VORLAGEN[b.vorlage]; if (!v) continue;
    for (const p of positionen(b)) for (const t of v.hinweise(p)) out.push({ text: `${p.name}: ${t}`, wo: b.name, href: `#/b/${b.id}` }); }
  return out;
}

/* ───────────── Diagramm (eine Linie, Fadenkreuz mit Wert) ───────────── */
function chartHtml(pts, fmt) {
  return `<div class="chart" data-chart='${esc(JSON.stringify(pts))}' data-fmt="${fmt}" role="img" aria-label="Verlauf"></div>`;
}
function zeichneCharts() {
  document.querySelectorAll('.chart[data-chart]').forEach(el => {
    const pts = JSON.parse(el.dataset.chart); const fmt = el.dataset.fmt === 'm' ? v => fEur(v) + '/Monat' : fEur;
    const W = el.clientWidth || 300, H = el.clientHeight || 170, L = 46, R = 8, T = 10, B = 22;
    if (!pts.length) { el.innerHTML = '<div class="note">Der Verlauf erscheint, sobald Werte eingetragen sind.</div>'; return; }
    const max = Math.max(...pts.map(p => p.v), 0), min = Math.min(...pts.map(p => p.v), 0);
    const step = nice((max - min) / 3 || 1); const top = Math.ceil(max / step) * step || step, bot = Math.floor(min / step) * step;
    const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
    const y = v => T + (top - v) / (top - bot) * (H - T - B);
    let s = '';
    for (let g = bot; g <= top + step / 2; g += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${L - 6}" y="${y(g) + 3}" text-anchor="end">${kompakt.format(g)}</text>`;
    const idx = pts.length <= 3 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    for (const i of idx) s += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 && pts.length > 1 ? 'start' : i === pts.length - 1 && pts.length > 1 ? 'end' : 'middle'}">${i === pts.length - 1 ? 'heute' : fMonat(pts[i].d)}</text>`;
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    if (pts.length > 1) s += `<path class="ar" d="${line}L${x(pts.length - 1)},${y(Math.max(bot, 0))}L${x(0)},${y(Math.max(bot, 0))}Z"/><path class="ln" d="${line}"/>`;
    s += `<circle class="pt" r="4" cx="${x(pts.length - 1)}" cy="${y(pts.at(-1).v)}"/>`;
    s += `<g class="hov" hidden><line class="hair" y1="${T}" y2="${H - B}"/><circle class="pt" r="4.5"/></g>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg><div class="tip" hidden></div>`;
    const svg = el.firstChild, hov = svg.querySelector('.hov'), tip = el.querySelector('.tip');
    const zeig = cx => {
      const i = Math.max(0, Math.min(pts.length - 1, Math.round(pts.length === 1 ? 0 : (cx - L) / ((W - L - R) / (pts.length - 1)))));
      hov.hidden = false; hov.firstChild.setAttribute('x1', x(i)); hov.firstChild.setAttribute('x2', x(i));
      hov.lastChild.setAttribute('cx', x(i)); hov.lastChild.setAttribute('cy', y(pts[i].v));
      tip.hidden = false; tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = fmt(pts[i].v);
      const sp = document.createElement('span'); sp.textContent = i === pts.length - 1 ? 'heute' : 'Ende ' + new Date(pts[i].d + 'T12:00:00').toLocaleDateString('de-AT', { month: 'long', year: 'numeric' });
      tip.append(b, sp); const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(W - tw, x(i) - tw / 2)) + 'px'; tip.style.top = Math.max(0, y(pts[i].v) - 52) + 'px';
    };
    svg.addEventListener('pointermove', e => zeig(e.clientX - svg.getBoundingClientRect().left));
    svg.addEventListener('pointerdown', e => zeig(e.clientX - svg.getBoundingClientRect().left));

}
function nice(v) { const p = 10 ** Math.floor(Math.log10(v)); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

    else { const id = uid(); aendern(() => { S.bausteine[id] = { id, vorlage: fd.get('vorlage'), name: fd.get('name').trim(), notiz: fd.get('notiz').trim(), positionen: {}, reihe: Object.keys(S.bausteine).length }; }); location.hash = '#/b/' + id; }
  };
  $dlg.showModal();
}

/* ───────────── Sicherung ───────────── */
async function exportieren() {
  const name = `Finanzen ${heute()}.json`;
  const blob = new Blob([JSON.stringify({ app: 'finanzen', version: 1, exportiert: new Date().toISOString(), daten: S }, null, 1)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] }) && /iPhone|iPad/.test(navigator.userAgent)) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importieren(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'finanzen' || !j.daten?.bausteine) return toast('Das ist kein Finanzen-Backup');
    const n = Object.keys(j.daten.bausteine).length;
    if (!confirm(`Backup vom ${new Date(j.exportiert).toLocaleString('de-AT')} mit ${n} Bausteinen einlesen? Die Daten auf diesem Gerät werden ersetzt.`)) return;
    await aendern(() => { S = Object.assign(leer(), j.daten); });
    toast('Backup eingelesen');
  } catch { toast('Datei konnte nicht gelesen werden'); }
}

  add('stand', 'ETF-Depot', [

/* ───────────── Ereignisse ───────────── */
let toastT;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-person],[data-zeitraum]');
  if (c?.dataset.person != null) { personFilter = c.dataset.person; pref.set('person', personFilter); return render(); }
  if (c?.dataset.zeitraum) { zeitraum = c.dataset.zeitraum; pref.set('zeitraum', zeitraum); return render(); }
  const el = e.target.closest('[data-act]'); if (!el || $dlg.contains(el)) return;
  const a = el.dataset.act, bid = location.hash.split('/')[2];
  if (a === 'neuBaustein') oeffneBaustein(el.dataset.bereich);
  if (a === 'bausteinBearbeiten') oeffneBaustein(VORLAGEN[S.bausteine[bid].vorlage].bereich, bid);
  if (a === 'pos') oeffnePosition(bid, el.dataset.id);
  if (a === 'personWeg' && confirm('Person entfernen? Ihre Positionen bleiben erhalten und zählen dann zu „Familie“.')) aendern(() => { S.personen = S.personen.filter(p => p.id !== el.dataset.id); for (const b of Object.values(S.bausteine)) for (const p of Object.values(b.positionen || {})) if (p.person === el.dataset.id) delete p.person; if (personFilter === el.dataset.id) personFilter = ''; });
  if (a === 'export') exportieren();
  if (a === 'demo' && confirm('Beispieldaten laden? Die Daten auf diesem Gerät werden ersetzt.')) { aendern(() => { S = beispiel(); }); location.hash = '#/'; }
  if (a === 'allesWeg' && confirm('Wirklich alle Daten auf diesem Gerät löschen? Vorher am besten ein Backup exportieren.')) aendern(() => { S = leer(); personFilter = ''; });
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'import' && e.target.files[0]) { importieren(e.target.files[0]); e.target.value = ''; } });

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
